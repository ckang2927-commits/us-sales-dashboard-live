<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive">
  <title>美国站经营看板 · 明细</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;color:#253d5b;background:#f4f7fa;font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}
    body{display:flex;flex-direction:column}header{flex:none;background:#eaf0f7;border-bottom:1px solid #d2deeb;padding:6px 18px;display:flex;align-items:center;gap:16px}
    a{color:#275582;font-weight:650;text-decoration:none}a:hover{text-decoration:underline}header span{font-size:12px;color:#576a83}
    #loading{position:absolute;inset:38px 0 0;z-index:2;display:grid;place-items:center;gap:16px;padding:24px;background:#f4f7fa;overflow:auto}
    #loading[hidden]{display:none}#loading.has-preview{align-content:start}
    .card,.preview{width:min(520px,100%);padding:24px;border:1px solid #dce4ee;border-radius:9px;background:#fff}
    #loading.has-preview .card,.preview{width:min(760px,100%)}
    h1,h2{margin:0 0 8px;line-height:1.3}h1{font-size:21px}h2{font-size:17px}p{margin:0 0 12px}
    #detail,#preview-period{font-size:12px;color:#506681}progress{width:100%;height:8px;accent-color:#567ba9;display:block}progress[hidden]{display:none}
    .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}.actions button{font:inherit;border:1px solid #c7d5e8;border-radius:5px;padding:6px 12px;background:#fff;color:#365980;cursor:pointer}
    #retry{background:#315781;color:#fff}#dashboard{flex:1;min-height:0;width:100%;border:0;background:#f4f7fa}
    .preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 10px}
    .preview-grid div{padding:12px;background:#f0f4f9;border:1px solid #e3eaf3;border-radius:6px}
    .preview-grid dt,.platforms dt{font-size:12px;color:#506681}.preview-grid dd,.platforms dd{margin:3px 0 0;font-variant-numeric:tabular-nums;font-weight:700}.preview-grid dd{font-size:20px}
    .platforms{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0}.platforms div{display:flex;align-items:baseline;gap:8px}
    @media(max-width:520px){#loading{padding:12px}.card,.preview{padding:16px}.preview-grid{grid-template-columns:1fr 1fr}.preview-grid div:first-child{grid-column:1/-1}.preview-grid dd{font-size:18px}}
    noscript{padding:14px}
  </style>
</head>
<body>
  <header><a href="./">← 老板首页</a><span>经营明细与来源</span></header>
  <main id="loading">
    <section class="preview" id="sales-preview" aria-labelledby="preview-title" hidden>
      <h1 id="preview-title">全部 SKU 销量 · 近 30 天概览</h1>
      <p id="preview-period"></p>
      <dl class="preview-grid">
        <div><dt>商品销售额参考</dt><dd id="preview-amount"></dd></div>
        <div><dt>已核净销量</dt><dd id="preview-units"></dd></div>
        <div><dt>有效订单</dt><dd id="preview-orders"></dd></div>
      </dl>
      <dl class="platforms" id="preview-platforms" aria-label="各平台商品销售额参考"></dl>
    </section>
    <section class="card" aria-label="明细加载状态">
      <h2>正在打开经营明细</h2>
      <p id="status" role="status" aria-live="polite">读取本次发布版本</p>
      <p id="detail">正在准备完整筛选和订单明细。</p>
      <progress id="progress" max="100" aria-label="明细加载进度"></progress>
      <div class="actions"><button id="cancel" type="button">取消</button><button id="retry" type="button" hidden>重新加载</button><a href="./">返回老板首页</a></div>
    </section>
  </main>
  <iframe id="dashboard" title="美国站经营看板明细" referrerpolicy="no-referrer" style="visibility:hidden"></iframe>
  <noscript>完整明细需要 JavaScript。</noscript>
  <script defer src="./details-preview-c42a81fdd114bdb25f571b4c.js"></script>
  <script defer src="./details-loader-f73f71391384562df86f82e1.js"></script>
</body>
</html>
