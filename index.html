<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>美国站经营看板</title>
  <style>:root{color-scheme:light;--ink:#172c47;--muted:#556980;--line:#d9e3ed;--paper:#fff;--back:#f3f6fa;--blue:#305e91;--up:#255c8d;--down:#9a4d35;--subtle:#eaf1f8}
*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid #7eafe0;outline-offset:3px}
.wrap{max-width:1300px;margin:auto;padding-inline:28px}
.mast{background:var(--paper);border-top:5px solid #2b527d;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-block:23px 20px}
h1{font-size:26px;letter-spacing:.01em;margin:0;font-weight:720}p{margin:0;color:var(--muted)}
.top p{font-size:13px;margin-top:4px}.primary,.secondary{padding:8px 14px;border-radius:6px;border:1px solid transparent;font-weight:650;white-space:nowrap}
.primary{background:#244f7f;color:white}.primary span{margin-left:6px}.primary:hover{background:#193b61;text-decoration:none}
.secondary{color:var(--blue);background:#f6f9fc;border-color:var(--line)}.secondary[hidden]{display:none}
.indicators{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:20px 14px}
.indicator,.panel{background:var(--paper);border:1px solid var(--line);border-radius:9px}
.indicator{padding:15px 17px;min-width:0}.indicator:first-child{border-color:#b9cfe4;background:#fafdff}
.indicator .label{font-size:13px;font-weight:640;color:#365373}.indicator strong{font-size:clamp(19px,2.15vw,28px);line-height:1.2;letter-spacing:-.02em;display:block;margin:8px 0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.indicator p{font-size:12px}.up{color:var(--up)}.down{color:var(--down)}
.overview-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.panel{padding:17px 18px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}
h2{font-size:17px;letter-spacing:.01em;margin:0 0 4px}.section-head p{font-size:12px}
.channel{display:grid;grid-template-columns:95px minmax(70px,1fr) 90px;gap:10px;align-items:center;border-top:1px solid #e8eef4;padding:9px 0}
.channel:first-child{border-top:0}.channel .name{font-weight:680}.channel small{display:block;font-size:11px;color:var(--muted)}
.channel .volume{display:grid;gap:5px}.channel .barline{display:grid;grid-template-columns:minmax(20px,1fr) 96px;gap:8px;align-items:center}
.channel .barline span:last-child{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:#304c6a}
.track{display:block;height:6px;border-radius:3px;background:#edf2f7}.track i{display:block;height:100%;border-radius:3px;background:#426d9b}.prior .track i{background:#9ab3ca}
.channel .change{text-align:right;font-variant-numeric:tabular-nums}.change b{font-size:13px}.change small{font-size:11px}
.annotation{font-size:11.5px;border-top:1px solid #e7edf4;margin-top:9px;padding-top:9px}
.review-links{display:grid;gap:6px}.review-link{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;background:#f3f7fb;color:var(--ink)}
.review-link:hover{background:#e6eff8;text-decoration:none}.review-link b{font-size:13px}.review-link small{display:block;margin-top:1px;color:var(--muted);font-size:11.5px}
.review-link > span:last-child{color:var(--blue);flex:none}
.products{margin-top:14px}.switch{display:flex;white-space:nowrap;border:1px solid #cbd9e8;border-radius:6px;overflow:hidden}.switch button{border:0;background:#fff;color:#335681;padding:6px 11px}.switch button+button{border-left:1px solid #cbd9e8}.switch button[aria-pressed=true]{background:#244f7f;color:#fff}
.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #e8eef5;font-variant-numeric:tabular-nums}
th{background:#eef4fa;color:#385572;font-size:12px;white-space:nowrap}td small{display:block;color:var(--muted);font-size:11px}td b{font-size:13px}
td a{font-weight:700}.table-foot{display:flex;align-items:center;justify-content:space-between;gap:13px;padding-top:9px}.table-foot p{font-size:12px}
.footer{padding-block:14px 25px}.footer nav{display:flex;gap:7px 16px;flex-wrap:wrap;margin-bottom:8px;font-size:12px}.footer p{font-size:11.5px}
@media(max-width:850px){.wrap{padding-inline:14px}.indicators{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-grid{grid-template-columns:1fr}}
@media(max-width:460px){.top{gap:9px}.top h1{font-size:20px}.top p{font-size:11px}.primary{font-size:12px}.indicator{padding:11px 10px}.indicator p{font-size:11px}.channel{grid-template-columns:65px minmax(55px,1fr) 64px;gap:7px}.channel .barline{grid-template-columns:minmax(15px,1fr) 77px}.channel .barline span:last-child{font-size:11px}.panel{padding:13px 11px}.section-head h2{font-size:15px}}

.table-actions{display:flex;flex-wrap:wrap;gap:6px}

/* 老板首页的图表与现有明细使用同一只读快照。 */
.panel{min-width:0}
.overview-grid{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr)}
.chart-link{flex:none;font-size:12px;font-weight:650}
.trend-tools,.chart-legend,.trend-focus{display:flex;align-items:center;gap:12px}
.trend-tools{justify-content:space-between;flex-wrap:wrap}
.trend-panel .switch button{padding:5px 9px;font-size:12px}
.chart-legend{color:var(--muted);font-size:11.5px;white-space:nowrap}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:14px;border-top:2px solid #245f9b}
.chart-legend .previous i{border-top:2px dashed #876f9d}
#salesTrend{display:block;width:100%;height:202px;margin:6px 0 1px;touch-action:pan-y}
.trend-focus{min-height:33px;flex-wrap:wrap;font-size:12px;border-top:1px solid #e7edf4;padding-top:6px}
.trend-focus label{white-space:nowrap;color:var(--muted)}
.trend-focus input{width:112px;accent-color:var(--blue);margin:0}
.trend-focus p{color:#34526f;font-variant-numeric:tabular-nums}
.trend-focus p strong{color:var(--ink)}
.channel-panel .channel{padding:14px 0}
.channel-panel .annotation{margin-top:9px}
.stock-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.stock-row{display:grid;grid-template-columns:85px minmax(0,1fr) 66px;align-items:center;gap:9px;padding:6px 0}
.stock-row strong,.region-details{font-variant-numeric:tabular-nums}
.stock-row .track{height:8px}
.stock-row .stock-value{text-align:right;color:#284963}
.stock-row .stock-label{color:#304d68;font-weight:650;white-space:nowrap;font-size:12px}
#regionalStock .stock-row{padding:9px 0 1px}
.region-details{font-size:11.5px;margin:0 0 4px 94px}
.age-row{padding:2px 0}
.age-row .track{height:7px}
.age-row.older .track i{background:#a87550}
.age-row .stock-label{font-weight:500}
.candidate-chart{display:grid;grid-template-columns:minmax(0,1fr) minmax(215px,.44fr);align-items:stretch;gap:20px;padding:10px 0 15px}
.scatter-wrapper{padding:5px 14px 0 53px;min-width:0}
.scatter{height:184px;position:relative;margin:20px 0;border-bottom:1px solid #abbed1;border-left:1px solid #abbed1;background:linear-gradient(#f8fbfe,#fff)}
.scatter-caption{position:absolute;left:0;top:-23px;font-size:11px;color:var(--muted);white-space:nowrap}
.scatter-y-tick,.scatter-x-tick{position:absolute;pointer-events:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.scatter-y-tick{left:0;right:0;border-top:1px solid #e2ebf3}
.scatter-y-tick span{position:absolute;right:calc(100% + 7px);top:-9px}
.scatter-x-tick{bottom:-19px;transform:translateX(-50%)}
.scatter-x{font-size:11px;text-align:center}
.scatter-mark{position:absolute;border:1.5px solid #fff;border-radius:50%;padding:0;background:#4e80b6bb;box-shadow:0 0 0 1px #4577a94d;transform:translate(-50%,50%)}
.scatter-mark:hover,.scatter-mark:focus-visible,.scatter-mark[aria-pressed=true]{background:#245f9b;box-shadow:0 0 0 2px #d1e2f3;z-index:2}
.scatter-mark.forecast{background:#a46747}
.candidate-focus{border:1px solid #e0eaf3;border-radius:8px;background:#f6f9fc;padding:13px 14px;align-self:center}
.candidate-focus strong{font-size:16px;display:block;margin-bottom:4px}.candidate-focus p{margin:5px 0;font-size:12px}
.candidate-focus a{display:inline-block;margin-top:5px;font-size:12px;font-weight:700}
.review-panel{margin-top:14px}.review-panel .review-links{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:920px){.overview-grid{grid-template-columns:1fr}}
@media(max-width:690px){.stock-grid,.candidate-chart,.review-panel .review-links{grid-template-columns:1fr}.candidate-chart{gap:11px}.candidate-focus{margin:0 0 6px}.trend-panel .section-head{flex-wrap:wrap;row-gap:8px}}
@media(max-width:460px){.chart-link{font-size:11px}#salesTrend{height:175px}.trend-focus{column-gap:8px}.trend-focus input{width:90px}.table-foot{flex-wrap:wrap}.channel-panel .channel{padding:9px 0}}
</style>
</head>
<body>
  <header class="mast">
    <div class="wrap top">
      <div><h1>美国站经营看板</h1><p id="scope"></p></div>
      <a class="primary" href="./details.html?view=sales">进入明细 <span aria-hidden="true">→</span></a>
    </div>
  </header>
  <main class="wrap">
    <section class="indicators" aria-label="最近30天关键指标" id="indicators"></section>
    <div class="overview-grid">
      <section class="panel trend-panel" aria-labelledby="trendTitle">
        <div class="section-head"><div><h2 id="trendTitle">每日经营走势</h2><p id="trendDates"></p></div>
          <div class="switch" role="group" aria-label="走势指标">
            <button type="button" data-metric="amountCents" aria-pressed="true">商品额</button><button type="button" data-metric="orders" aria-pressed="false">订单</button><button type="button" data-metric="lower" aria-pressed="false">净销量下界</button>
          </div>
        </div>
        <div class="trend-tools">
          <div class="switch" role="group" aria-label="走势渠道">
            <button type="button" data-channel="total" aria-pressed="true">全部</button><button type="button" data-channel="Amazon" aria-pressed="false">Amazon</button><button type="button" data-channel="Shopify" aria-pressed="false">独立站</button><button type="button" data-channel="Wayfair" aria-pressed="false">Wayfair</button>
          </div>
          <div class="chart-legend"><span><i></i>本期</span><span class="previous"><i></i>前期</span></div>
        </div>
        <canvas id="salesTrend" role="img" aria-label="按各期第几天对齐的每日经营走势"></canvas>
        <div class="trend-focus">
          <label for="trendDay">第 <b id="trendDayNumber">30</b> 天</label>
          <input id="trendDay" type="range" min="1" max="30" value="30" aria-label="对比两期的第几天">
          <p id="trendValues"></p>
        </div>
      </section>
      <section class="panel channel-panel" aria-labelledby="comparison">
        <div class="section-head"><div><h2 id="comparison">渠道商品额</h2><p id="comparisonDates"></p></div></div>
        <div id="platformCompare"></div>
        <p class="annotation">独立站为折扣前商品行金额，Wayfair为供货额。</p>
      </section>
    </div>
    <div class="stock-grid">
      <section class="panel" aria-labelledby="stockTitle">
        <div class="section-head"><div><h2 id="stockTitle">三区可用库存</h2><p id="stockChartDate"></p></div><a class="chart-link" href="./details.html?view=warehouses">库存明细 →</a></div>
        <div id="regionalStock"></div>
        <p class="annotation" id="stockChartNote"></p>
      </section>
      <section class="panel" aria-labelledby="ageTitle">
        <div class="section-head"><div><h2 id="ageTitle">YQN库龄分布</h2><p id="ageChartDate"></p></div><a class="chart-link" href="./details.html?view=warehouses">库龄明细 →</a></div>
        <div id="inventoryAge"></div>
        <p class="annotation" id="ageChartNote"></p>
      </section>
    </div>
    <section class="panel products" aria-labelledby="priority-products">
      <div class="section-head">
        <div><h2 id="priority-products">高运营利润、低动销的在库老品</h2><p>常规品与滞销品 · 近30天净销量上界≤5 · 主表可用大于0</p></div>
        <div class="switch" role="group" aria-label="历史运营利润率下限"><button type="button" data-threshold=".15" aria-pressed="true">≥15%</button><button type="button" data-threshold=".20" aria-pressed="false">≥20%</button></div>
      </div>
      <div class="candidate-chart">
        <div class="scatter-wrapper"><div id="candidatePlot" class="scatter" role="group" aria-label="近30天净销量上界与历史运营利润率"></div><p class="scatter-x">近30天净销量上界（套） · 棕色圆点的通知价估算低于15%</p></div>
        <div id="candidateFocus" class="candidate-focus" aria-live="polite"></div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th scope="col">SKU</th><th scope="col">主表可用／YQN最高龄档</th><th scope="col">近30天净销量</th><th scope="col">历史运营利润率</th><th scope="col">样本笔数和截止日</th><th scope="col">下一步</th></tr></thead>
          <tbody id="candidates"></tbody>
        </table>
      </div>
      <div class="table-foot"><p id="candidateCount" aria-live="polite"></p><div class="table-actions"><button id="downloadRows" class="secondary" type="button">导出清单</button><button id="toggleRows" class="secondary" type="button">展开全部</button></div></div>
      <p class="annotation" id="candidateDefinition"></p>
    </section>
    <section class="panel review-panel" aria-labelledby="exceptions">
      <div class="section-head"><h2 id="exceptions">经营复核入口</h2></div>
      <div id="reviewLinks" class="review-links"></div>
    </section>
  </main>
  <footer class="wrap footer">
    <nav aria-label="原看板全部模块">
      <a href="./details.html?view=sales">全部SKU销量</a><a href="./details.html?view=warehouses">库存与在途</a><a href="./details.html?view=query">SKU数据查询</a>
      <a href="./details.html?view=plans">清仓与促销</a><a href="./details.html?view=refunds">退款与售后</a><a href="./details.html?view=newproducts">新品跟踪</a>
      <a href="./details.html?view=replenishment">备货计划</a><a href="./details.html?view=audit">累计降幅核对</a><a href="./details.html?view=pieces">残件与配件</a>
    </nav>
    <p id="statusDates"></p>
  </footer>

  <script>/* 汇总图表沿用首页的已核口径，无外部图表依赖。 */
(() => {
  'use strict';
  const get = id => document.getElementById(id);
  const whole = new Intl.NumberFormat('zh-CN');
  const currency = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD'});
  const format = value => whole.format(value);
  const usd = cents => currency.format(cents / 100);
  const shortDate = date => date.slice(5).replace('-', '/');
  const percent = value => (100 * value).toFixed(2) + '%';
  const valueLabel = {
    amountCents:[usd, value => value ? '$' + format(value / 100000) + 'k' : '$0'],
    orders:[value => format(value)+' 单',format],
    lower:[value => format(value)+' 源单位',format],
  };
  const escape = value => String(value ?? '待核').replace(/[&<>"']/g, char =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const colors = ['#245f9b','#876f9d'];
  const channelNames = {total:'全部平台',Amazon:'Amazon',Shopify:'独立站',Wayfair:'Wayfair'};
  const metricNames = {amountCents:'商品额（USD）',orders:'有效订单（单）',lower:'已核净量下界（源商品单位）'};

  function renderSales(sales) {
    const chart = get('salesTrend');
    const ctx = chart.getContext('2d');
    const dayControl = get('trendDay');
    const readout = get('trendValues');
    const periods = [sales.current,sales.previous];
    const controls = {metric:[...document.querySelectorAll('[data-metric]')],
      channel:[...document.querySelectorAll('[data-channel]')]};
    const slot = {metric:'amountCents',channel:'total'};
    const dayCount = periods[0].days.length;
    dayControl.max = dayCount;
    let hoveredDay = dayCount - 1;
    const points = period => period.days.map(row => slot.channel === 'total' ? row.total : row.platforms[slot.channel]);
    get('trendDates').textContent = '各期按第几天对齐 · ' + periods.map(period =>
      shortDate(period.start)+'–'+shortDate(period.end)).join(' 对比 ');
    function updateDetails(series) {
      const values = series.map(rows => rows[hoveredDay][slot.metric]);
      const [formatMetric] = valueLabel[slot.metric];
      get('trendDayNumber').textContent = hoveredDay + 1;
      dayControl.value = hoveredDay + 1;
      dayControl.setAttribute('aria-valuetext', '第'+(hoveredDay + 1)+'天');
      chart.setAttribute('aria-label',channelNames[slot.channel] + '每日' + metricNames[slot.metric] + ' · 本期与前期对比');
      readout.title = slot.metric === 'orders' && sales.hasOrderCalendarOverlap ? sales.orderCountNote : '';
      readout.innerHTML = ['本期','前期'].map((label,i) =>
        label+' '+shortDate(periods[i].days[hoveredDay].date)+' <strong>'+formatMetric(values[i])+'</strong>').join('　／　');
    }

    function draw() {
      const series = periods.map(points);
      updateDetails(series);
      if (!ctx) return;
      const w = chart.clientWidth, h = chart.clientHeight;
      if (!w || !h) return;
      const ratio = Math.min(2, window.devicePixelRatio || 1);
      chart.width = Math.round(w * ratio);
      chart.height = Math.round(h * ratio);
      ctx.setTransform(ratio,0,0,ratio,0,0);

      const peak = Math.max(1,...series.flatMap(rows => rows.map(row => row[slot.metric])));
      const targetStep = peak / 4;
      const exponent = 10 ** Math.floor(Math.log10(targetStep));
      const step = Math.max(slot.metric === 'amountCents' ? 100000 : 1,
        [1,2,2.5,5,10].find(n => n * exponent >= targetStep) * exponent);
      const top = Math.ceil(peak / step) * step;
      const left = slot.metric === 'amountCents' ? 51 : 35;
      const right = w - 13, base = h - 25, ceiling = 15;
      const x = i => left + (right - left) * i / (periods[0].days.length - 1);
      const y = value => base - (base - ceiling) * value / top;

      ctx.font = '11px system-ui,sans-serif';
      ctx.fillStyle = '#566d85';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'right';
      for (let tick = 0; tick <= top; tick += step) {
        const ordinate = y(tick);
        ctx.strokeStyle = tick ? '#e2eaf2' : '#aabed1';
        ctx.beginPath(); ctx.moveTo(left,ordinate); ctx.lineTo(right,ordinate); ctx.stroke();
        ctx.fillText(valueLabel[slot.metric][1](tick),left-7,ordinate);
      }
      ctx.textAlign = 'center';
      for (const day of w < 410 ? [1,10,20,dayCount] : [1,5,10,15,20,25,dayCount]) {
        ctx.textAlign = day === dayCount ? 'right' : 'center';
        ctx.fillText('第'+day+'天',x(day-1),h-11);
      }
      const focus = x(hoveredDay);
      ctx.strokeStyle = '#b3c6da';
      ctx.beginPath(); ctx.moveTo(focus,ceiling); ctx.lineTo(focus,base); ctx.stroke();
      for (const i of [1,0]) {
        const values = series[i].map(row => row[slot.metric]);
        ctx.strokeStyle = colors[i];
        ctx.lineWidth = i ? 1.6 : 2.3;
        ctx.setLineDash(i ? [5,4] : []);
        ctx.lineJoin = 'round';
        ctx.beginPath();
        values.forEach((value,k) => k ? ctx.lineTo(x(k),y(value)) : ctx.moveTo(x(k),y(value)));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = colors[i];
        ctx.beginPath(); ctx.arc(focus,y(values[hoveredDay]),4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.15; ctx.stroke();
      }
    }

    for (const [key,buttons] of Object.entries(controls)) {
      for (const button of buttons) button.addEventListener('click', () => {
        slot[key] = button.dataset[key];
        buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        draw();
      });
    }
    dayControl.addEventListener('input', () => {hoveredDay = Number(dayControl.value) - 1;draw();});
    function pointNear(event) {
      const rect = chart.getBoundingClientRect();
      const left = slot.metric === 'amountCents' ? 51 : 35;
      const segment = (event.clientX - rect.left - left) / (rect.width - left - 13);
      const next = Math.max(0,Math.min(dayCount-1,Math.round(segment * (dayCount-1))));
      if (next !== hoveredDay) {hoveredDay = next;draw();}
    }
    chart.addEventListener('pointermove', event => {if (event.pointerType === 'mouse') pointNear(event);});
    chart.addEventListener('pointerdown',pointNear);
    new ResizeObserver(draw).observe(chart);
    draw();
  }

  function renderInventory({master,yqnAge}) {
    get('stockChartDate').textContent = master.date + ' 主表 · 已知套数';
    get('ageChartDate').textContent = yqnAge.date + ' 仓配快照 · 物理齐套下界';
    const bar = (label, units, max, extra = '') =>
      '<div class="stock-row '+extra+'"><span class="stock-label">'+escape(label)+'</span><span class="track" aria-hidden="true"><i style="width:'+100*units/max+'%"></i></span><strong class="stock-value">'+format(units)+' 套</strong></div>';
    if (master.totalsMatch) {
      const max = Math.max(1,...master.regions.map(region => region.available.units));
      get('regionalStock').innerHTML = master.regions.map(region =>
        bar(region.label,region.available.units,max)+'<p class="region-details">预留 '+format(region.reserved.units)+' 套 · 在途 '+format(region.transit.units)+' 套</p>').join('');
      get('stockChartNote').textContent = '三区合计可用 '+format(master.national.available.units)+' 套 · '+format(master.national.available.unknownSkus)+' 款主表可用待核。';
    } else {
      get('regionalStock').textContent = '区域主表小计与全国待核。';
    }
    const ageMax = Math.max(1,...yqnAge.bands.map(band => band.units));
    get('inventoryAge').innerHTML = yqnAge.bands.map((band,index) =>
      bar(band.label.replace(/（API档）$/u,''),band.units,ageMax,'age-row' + (index >= 4 ? ' older' : ''))).join('');
    const aged = yqnAge.bands.slice(4).reduce((total,band) => total + band.units,0);
    get('ageChartNote').textContent = '120天以上已核 '+format(aged)+' 套 · '+yqnAge.coveredSkus+'/'+yqnAge.scopeSkus+' 款有可量化库龄。含预留。';
  }

  function renderCandidatePlot(rows, population) {
    const plot = get('candidatePlot');
    const focus = get('candidateFocus');
    if (!rows.length) {
      plot.textContent = '';
      focus.textContent = '当前利润门槛暂无候选。';
      return;
    }
    const maxMargin = Math.max(.25,Math.ceil(Math.max(...population.map(row => row.margin))/.05)*.05);
    const yMin = .12;
    const yMax = maxMargin+.0175;
    const xFor = (q,offset=0) => (q + .5 + offset) / 6 * 100;
    const yFor = p => (p - yMin) / (yMax - yMin) * 100;
    const ticks = [];
    for (let tick = 15; tick <= Math.round(maxMargin*100); tick += 5) {
      ticks.push('<div class="scatter-y-tick" style="bottom:'+yFor(tick/100)+'%"><span>'+tick+'%</span></div>');
    }
    for (let n = 0; n <= 5; n++) {
      ticks.push('<div class="scatter-x-tick" style="left:'+xFor(n)+'%">'+n+'</div>');
    }
    const greatestStock = Math.max(1,...population.map(row => row.available));
    const sizes = rows.map(row => 12 + 16 * Math.sqrt(row.available/greatestStock));
    const offsets = new Array(rows.length).fill(0);
    for (let quantity = 0; quantity <= 5; quantity++) {
      const slots = [{offset:0},{offset:-.27},{offset:.27}];
      const group = rows.map((row,index) => ({row,index})).filter(({row}) => row.upper === quantity)
        .sort((a,b) => a.row.margin - b.row.margin);
      for (const {row,index} of group) {
        const bottom = yFor(row.margin)/100 * plot.clientHeight - sizes[index]/2;
        const slot = slots.find(item => item.top === undefined || item.top + 2 < bottom)
          || slots.reduce((earliest,item) => item.top < earliest.top ? item : earliest);
        offsets[index] = slot.offset;
        slot.top = bottom+sizes[index];
      }
    }
    plot.innerHTML = '<div class="scatter-caption">历史运营利润率 · 圆点大小为可用库存</div>'+ticks.join('')+rows.map((row,i) => {
      const size = sizes[i].toFixed(1);
      const title = row.sku+' · 净量上界 '+format(row.upper)+' 套 · 历史运营利润率 '+percent(row.margin)+' · 可用 '+format(row.available)+' 套';
      const forecast = row.forecastMargin !== null && row.forecastMargin < .15;
      return '<button type="button" class="scatter-mark'+(forecast?' forecast':'')+'" aria-pressed="false" data-point="'+i+
        '" title="'+escape(title)+'" aria-label="'+escape(title)+'" style="left:'+xFor(row.upper,offsets[i])+'%;bottom:'+yFor(row.margin)+
        '%;width:'+size+'px;height:'+size+'px"></button>';
    }).join('');
    const markers = [...plot.querySelectorAll('.scatter-mark')];
    function select(index) {
      const row = rows[index];
      markers.forEach((marker,i) => marker.setAttribute('aria-pressed',String(i===index)));
      const scenario = row.forecastMargin === null ? '' : '<p>通知价模拟 '+percent(row.forecastMargin)+'</p>';
      focus.innerHTML = '<strong>'+escape(row.sku)+'</strong><p>近30天净量上界 '+format(row.upper)+' 套 · 可用 '+format(row.available)+' 套</p><p>历史运营利润率 '+percent(row.margin)+'</p>' +
        scenario+'<p>'+escape(row.next)+'</p><a href="./details.html?view=query" data-sku="'+escape(row.sku)+'">查看SKU明细 →</a>';
    }
    markers.forEach((marker,i) => marker.addEventListener('click',() => select(i)));
    select(0);
  }
  window.bossCharts = {renderSales,renderInventory,renderCandidatePlot};
})();
</script>
  <script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('bossSummary').textContent);
  const {current,previous,platforms,inventory,coverage,chartSales,chartInventory} = data;
  const int = value => new Intl.NumberFormat('zh-CN').format(value);
  const usd = value => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(value);
  const pct = (value, digits=1) => value === null ? '待核' : (value * 100).toFixed(digits) + '%';
  const sign = value => value >= 0 ? '+' : '−';
  const short = date => date.slice(5).replace('-', '/');
  const windowLabel = period => short(period.start) + '–' + short(period.end);
  const encode = value => String(value ?? '待核').replace(/[&<>"']/g, token => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[token]));
  const quantity = record => record.lower === record.upper ? int(record.lower) : record.upper === null ? '≥' + int(record.lower) : int(record.lower) + '–' + int(record.upper);
  const currentDelta = (current.amount - previous.amount) / previous.amount;
  const orderDelta = (current.orders - previous.orders) / previous.orders;
  const label = (value, formatter) => sign(value) + formatter(Math.abs(value));
  const classFor = value => value < 0 ? 'down' : 'up';
  const modules = {
    warehouses:['库存差异复核', '主表缺可用依据 ' + inventory.unknownActive + ' 款 · 主表与YQN有数差 ' + (data.yqnDifference ?? '待核') + ' 款'],
    plans:['清仓待办', data.queues.toRecheck + ' 款待复核 · ' + data.queues.noStock + ' 款暂无可用'],
    refunds:['退款与售后凭证', '飞书登记至 ' + short(data.refundDate) + ' · Wayfair结算扣款至 ' + short(data.wayfairThrough) + '（部分）']
  };
  document.getElementById('scope').textContent = '最近完整30天 · 美西 ' + current.start + ' 至 ' + current.end + ' · 已核三平台9店';
  document.getElementById('comparisonDates').textContent = '本期 ' + windowLabel(current) + ' 对比前期 ' + windowLabel(previous);
  const kpis = [
    ['商品额参考',usd(current.amount),'较前30天 ' + label(currentDelta, v => pct(v,2)),currentDelta],
    ['已核净数量',quantity(current),'前30天 ' + quantity(previous) + ' · ' + int(current.pending) + ' 条净量待核',null],
    ['有效订单',int(current.orders),'前30天 ' + int(previous.orders) + ' · ' + label(orderDelta,v => pct(v,1)),orderDelta],
    ['主表已知可用',int(inventory.available) + ' 套','预留 ' + int(inventory.reserved) + ' · 在途 ' + int(inventory.transit),null]
  ];
  document.getElementById('indicators').innerHTML = kpis.map(([name,value,note,movement]) =>
    '<div class="indicator"><div class="label">'+encode(name)+'</div><strong>'+encode(value)+'</strong><p class="'+(movement===null?'':classFor(movement))+'">'+encode(note)+'</p></div>').join('');
  const max = Math.max(...platforms.flatMap(row => [row.current.amount,row.previous.amount]));
  const names = {Amazon:'Amazon',Shopify:'独立站',Wayfair:'Wayfair'};
  document.getElementById('platformCompare').innerHTML = platforms.map(row => {
    const delta = row.current.amount - row.previous.amount;
    const compareRow = (amount, caption, earlier = false) => '<div class="barline'+(earlier?' prior':'')+'" aria-label="'+caption+' '+encode(usd(amount))+'"><span class="track" aria-hidden="true"><i style="width:'+(100 * amount/max).toFixed(2)+'%"></i></span><span>'+encode(usd(amount))+'</span></div>';
    return '<div class="channel"><div class="name">'+encode(names[row.platform])+'<small>本期 / 前期</small></div><div class="volume">'
      + compareRow(row.current.amount,'本期') + compareRow(row.previous.amount,'前期',true)
      + '</div><div class="change '+classFor(delta)+'"><b>'+encode(label(delta/row.previous.amount,v=>pct(v,1)))+'</b><small>'+encode(label(delta,usd))+'</small></div></div>';
  }).join('');
  document.getElementById('reviewLinks').innerHTML = Object.entries(modules).map(([view,[title,note]]) =>
    '<a class="review-link" href="./details.html?view='+view+'"><span><b>'+encode(title)+'</b><small>'+encode(note)+'</small></span><span aria-hidden="true">→</span></a>').join('');
  document.getElementById('candidateDefinition').textContent = '销量按净量上界筛选，历史运营利润未含累计仓储。已知有货的老品 ' + coverage.identifiedOld + ' 款，其中低动销但缺利润依据 ' + coverage.oldWithMissingProfit + ' 款；另有在库且商品类型待核 ' + coverage.unknownType + ' 款。';
  document.getElementById('statusDates').textContent = '数据时间 · 主表 ' + data.stockDate + ' · YQN库龄 ' + data.ageDate + ' · 飞书售后／退款记录至 ' + data.aftersalesDate + '／' + data.refundDate;
  let threshold = .15;
  let expanded = false;
  const toggle = document.getElementById('toggleRows');
  const filteredRows = () => data.candidates.filter(row => row.margin >= threshold);
  function renderCandidates() {
    const rows = filteredRows();
    const limit = expanded ? rows.length : 8;
    document.querySelectorAll('[data-threshold]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.threshold) === threshold)));
    document.getElementById('candidates').innerHTML = rows.slice(0,limit).map(row => {
      const age = row.latestBand || '库龄待核';
      const forecast = row.forecastMargin === null ? '' : '<small>通知价模型 '+encode(pct(row.forecastMargin,2))+'</small>';
      const flags = row.flags.length ? '<small>'+encode(row.flags.join(' · '))+'</small>' : '';
      const sellout = row.days === null ? (row.upper === 0 ? '零动销，售罄待估' : '区间波动，售罄待估') : '按近30天速度约 '+int(row.days)+' 天';
      return '<tr><td><a href="./details.html?view=query" data-sku="'+encode(row.sku)+'">'+encode(row.sku)+'</a><small>'+encode(row.category)+'</small></td>'
        +'<td><b>'+int(row.available)+' 套</b><small>'+encode(age)+'</small></td><td>'+encode(quantity(row))+'<small>'+encode(sellout)+'</small></td>'
        +'<td><b>'+encode(pct(row.margin,2))+'</b>'+forecast+'</td><td>'+int(row.samples)+' 单 · '+encode(row.sampleDate)
        + '<small>'+int(row.samplePlatforms)+' 平台 / '+int(row.sampleStores)+' 店</small>'+ flags+'</td><td>'+encode(row.next)+'</td></tr>';
    }).join('') || '<tr><td colspan="6">当前门槛暂无符合且依据齐全的SKU。</td></tr>';
    document.getElementById('candidateCount').textContent = '显示 ' + Math.min(limit,rows.length) + ' / ' + rows.length + ' 款 · 按可用套数排序';
    toggle.hidden = rows.length <= 8;
    toggle.textContent = expanded ? '收起' : '展开全部 ' + rows.length + ' 款';
    toggle.setAttribute('aria-expanded',String(expanded));
  }
  document.querySelectorAll('[data-threshold]').forEach(button => button.addEventListener('click', () => {
    threshold = Number(button.dataset.threshold);
    expanded = false;
    window.bossCharts.renderCandidatePlot(filteredRows(),data.candidates);
    renderCandidates();
  }));
  toggle.addEventListener('click', () => {expanded = !expanded;renderCandidates();});
  document.querySelector('.products').addEventListener('click', event => {
    const link = event.target.closest('[data-sku]');
    if (link && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
      try {sessionStorage.setItem('bossPendingSku', link.dataset.sku);} catch (_) { /* Query remains available. */ }
    }
  });
  document.getElementById('downloadRows').addEventListener('click', () => {
    const header = ['SKU','分类','主表可用套数','YQN最高龄档','近30天净销量','历史运营利润率','通知价推算运营利润率','样本笔数','样本截止日','平台数','店铺数','依据提示','下一步','销量开始','销量截止','库存快照日'];
    const records = filteredRows().map(row => [row.sku,row.category,row.available,row.latestBand,
      quantity(row),pct(row.margin,2),pct(row.forecastMargin,2),row.samples,row.sampleDate,
      row.samplePlatforms,row.sampleStores,row.flags.join(' · '),row.next,current.start,current.end,data.stockDate]);
    const csv = [header,...records].map(row => row.map(value => '"' + String(value ?? '待核').replace(/"/g,'""') + '"').join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = '高运营利润低动销老品_' + (threshold * 100) + 'pct_' + current.end + '.csv';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url),5000);
  });
  window.bossCharts.renderSales(chartSales);
  window.bossCharts.renderInventory(chartInventory);
  window.bossCharts.renderCandidatePlot(filteredRows(),data.candidates);
  renderCandidates();
})();
</script>
</body>
</html>
