<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>美国站经营数据看板</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#334b6c;background:#f5f7fa}#loading{position:fixed;inset:0;z-index:2;min-height:100%;display:grid;place-items:center;padding:24px;background:#f5f7fa}#loading[hidden]{display:none!important}.card{width:min(560px,100%);padding:34px;border:1px solid #dce4ef;border-radius:10px;background:#fff;box-shadow:0 9px 32px #29436409}h1{font-size:22px;margin:0 0 24px;font-weight:650}#status{font-size:16px;margin:0 0 13px;color:#3d5d87}#detail,.note{font-size:12px;line-height:1.8;color:#71819a}#detail{min-height:43px;margin:0 0 13px}.note{border-top:1px solid #e9edf3;padding-top:16px;margin-top:22px}progress{width:100%;height:8px;accent-color:#567ba9;display:block;border:0;border-radius:4px}.actions{display:flex;gap:10px;margin-top:22px}button{font:inherit;font-size:12px;border:1px solid #c7d5e8;border-radius:4px;padding:8px 13px;background:#fff;color:#4b688e;cursor:pointer}#retry{background:#3f5d87;color:#fff;border-color:#3f5d87}#dashboard{border:0;width:100%;height:100%;height:100dvh;display:block;background:#f5f7fa}noscript{display:block;padding:24px}
</style>
</head>
<body>
<main id="loading"><section class="card"><h1>美国站经营数据看板</h1><p id="status" role="status" aria-live="polite">正在准备完整看板</p><p id="detail">首次打开需要读取完整数据，请稍候。</p><progress id="progress" max="100" aria-label="看板加载进度"></progress><div class="actions"><button id="cancel" type="button">取消加载</button><button id="retry" type="button" hidden>重新加载</button></div><p class="note">建议使用电脑上的新版Chrome或Edge。首次打开约需下载54 MB；之后刷新同一网址即可读取已发布的新版本。看板中的销售、库存和退款各有各的来源截止日期。</p></section></main>
<iframe id="dashboard" title="美国站完整经营数据看板" referrerpolicy="no-referrer" style="visibility:hidden"></iframe>
<noscript>此看板需要JavaScript。请启用JavaScript后重新打开。</noscript>
<script src="./loader.js"></script>
</body>
</html>
